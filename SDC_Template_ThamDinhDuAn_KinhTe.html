<title>Template Thẩm định Kinh tế Dự án (MPP27)</title>
<style>
  :root{

    --line:#31456f; --accent:#4f8cff;
    --b1:#4f8cff; --b2:#22c55e; --b3:#f59e0b; --b4:#ec4899; --b5:#a855f7; --b6:#14b8a6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  .site-shell{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  .hero h1{margin:0 0 6px;font-size:26px}
  .hero .lede{margin:0;color:var(--muted);max-width:760px;font-size:14px;line-height:1.5}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 12px}
  .toolbar button{background:var(--card);color:var(--ink);border:1px solid var(--line);
       border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .toolbar button:hover{border-color:var(--accent)}
  .zoom-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-left:auto}
  .diagram-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .diagram-viewport{overflow:auto;height:70vh;cursor:grab}
  .diagram-viewport.dragging{cursor:grabbing}
  .diagram-canvas{transform-origin:top center;padding:28px 40px;width:max-content;min-width:100%;position:relative}
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;justify-content:center}
  ul.tree{flex-direction:column;align-items:center}
  ul.tree li{display:flex;flex-direction:column;align-items:center;position:relative}
  ul.tree li>ul{margin-top:34px}
  .node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:stretch;min-width:130px;max-width:200px}
  .node-main{background:#16233f;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;
       cursor:pointer;color:var(--ink);text-align:center;font-size:13px;line-height:1.35;font-weight:600;transition:.15s}
  .node-main:hover{border-color:var(--accent);transform:translateY(-1px)}
  .node-en{display:block;font-size:9.5px;font-weight:400;font-style:italic;color:var(--muted);margin-top:2px;line-height:1.25}
  .panel-en{font-size:13px;font-weight:400;font-style:italic;color:var(--muted);margin-top:2px}
  .node .node-num{font-size:10px;color:var(--muted);margin-bottom:3px;text-align:center}
  .node.is-expanded .node-main{box-shadow:0 0 0 2px rgba(79,140,255,.25)}
  .node-expand-bar{margin-top:5px;height:14px;border:none;border-radius:6px;background:#1d2c4d;color:var(--muted);
       cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
  .node-expand-bar:hover{background:var(--accent);color:#fff}
  .node.branch-1 .node-main{border-color:var(--b1)} .node.branch-2 .node-main{border-color:var(--b2)}
  .node.branch-3 .node-main{border-color:var(--b3)} .node.branch-4 .node-main{border-color:var(--b4)}
  .node.branch-5 .node-main{border-color:var(--b5)} .node.branch-6 .node-main{border-color:var(--b6)}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  svg.links path{fill:none;stroke:var(--line);stroke-width:1.6}
  .scrim{position:fixed;inset:0;background:rgba(5,10,24,.55);z-index:40}
  .detail-panel{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);background:var(--card);
       border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:50;
       display:flex;flex-direction:column;padding:20px}
  .detail-panel.open{transform:translateX(0)}
  .panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .panel-id{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .panel-header h2{margin:4px 0 0;font-size:19px}
  .icon-button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .panel-group{color:var(--accent);font-size:12px;margin:10px 0 4px;font-weight:600}
  .markdown-content{font-size:14px;line-height:1.6;color:#cdd8f2;overflow:auto}
  .markdown-content h3{font-size:15px;margin:14px 0 6px}
  .markdown-content ul{padding-left:18px;margin:6px 0}
  .markdown-content code{background:#0c1830;padding:1px 5px;border-radius:4px;font-size:12px}
  .markdown-content a{color:var(--accent)}
  .markdown-content ol{padding-left:20px;margin:6px 0}
  .markdown-content .md-table-wrap{overflow-x:auto;margin:10px 0}
  .markdown-content table{border-collapse:collapse;width:100%;font-size:12.5px;background:#0d1830}
  .markdown-content th,.markdown-content td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
  .markdown-content th{background:#16233f;color:#dce7ff;font-weight:600}
  .markdown-content tbody tr:nth-child(even){background:#0b1526}
  .markdown-content pre{background:#0b1526;border:1px solid var(--line);border-radius:8px;
       padding:10px 12px;overflow:auto;margin:10px 0}
  .markdown-content pre code{background:none;padding:0;color:#cfe0ff;font-size:11.5px;
       font-family:"SF Mono",ui-monospace,Consolas,monospace;line-height:1.5;white-space:pre}
  .markdown-content blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--accent);
       background:#0d1830;border-radius:0 6px 6px 0;color:#c3d2f0}
  .markdown-content blockquote p{margin:6px 0}
  .child-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .child-pills button{background:#16233f;border:1px solid var(--line);color:var(--ink);border-radius:20px;
       padding:5px 10px;font-size:12px;cursor:pointer}
  .child-pills button:hover{border-color:var(--accent)}
  h3.section{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}

/* ===== v2 layout: toàn màn hình + chế độ Danh sách (outline nhiều cột) ===== */
.site-shell{max-width:1600px}
.diagram-viewport{height:76vh}
.diagram-card:fullscreen{border-radius:0;height:100vh}
.diagram-card:fullscreen .diagram-viewport{height:calc(100vh - 4px)}
.toolbar .seg{margin-left:2px}
.diagram-canvas.mode-list{width:100%;min-width:0;padding:16px 26px}
.diagram-canvas.mode-list svg.links{display:none}
.diagram-canvas.mode-list ul.tree{flex-direction:column;align-items:stretch;gap:6px;width:100%}
.diagram-canvas.mode-list ul.tree ul{flex-direction:column;align-items:stretch;gap:6px;margin-top:6px;padding-left:20px;border-left:2px solid var(--line);width:100%}
.diagram-canvas.mode-list ul.tree li{flex-direction:column;align-items:stretch;width:100%}
.diagram-canvas.mode-list ul.tree li>ul{margin-top:6px}
.diagram-canvas.mode-list .node{max-width:none;min-width:0;width:100%;flex-direction:row;align-items:center;gap:10px}
.diagram-canvas.mode-list .node .node-num{margin:0;min-width:20px;text-align:left}
.diagram-canvas.mode-list .node .node-main{text-align:left;flex:1;padding:7px 12px}
.diagram-canvas.mode-list .node .node-expand-bar{margin:0;height:26px;width:auto;padding:0 12px;flex:none}
/* các nhánh cấp 1 chảy thành nhiều CỘT để lấp đầy màn hình rộng */
.diagram-canvas.mode-list>ul.tree>li>ul{display:block;column-width:360px;column-gap:30px;border-left:none;padding-left:0}
.diagram-canvas.mode-list>ul.tree>li>ul>li{display:block;break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1830}
.diagram-canvas.mode-list>ul.tree>li>ul>li>ul{padding-left:16px}
.detail-panel{padding-left:24px}
.panel-resizer{position:absolute;left:0;top:0;height:100%;width:10px;cursor:ew-resize;z-index:3;background:transparent;border-left:2px solid transparent}
.panel-resizer:hover,.panel-resizer.active{border-left-color:var(--accent);background:linear-gradient(90deg,rgba(79,140,255,.20),transparent)}
</style>
</head>

          "detail": "**Mục tiêu:** mở file ra, đứng ở bất kỳ ô công thức nào, bấm `F2` / `Ctrl+[` / *Trace Precedents* là thấy ngay nguồn — **không phải nhảy sang sheet khác, không gặp số cứng vô danh, không phải đoán**. Đây là yêu cầu bắt buộc của mọi file sinh ra từ template này (PS2 25/07/2026).\n\n### Bố cục dòng — áp cho MỌI sheet tính (`MoHinh`, `MoHinh_C5`, `KinhTe`)\n\n| Dòng | Nội dung |\n|---|---|\n| 1 | Tiêu đề sheet + **đơn vị + mặt bằng giá + đồng tiền** (vd \"triệu USD, giá danh nghĩa\") |\n| 2 | Cảnh báo chế độ tính (chỉ khi file `.xlsm` có UDF: \"đang đặt MANUAL, bật macro rồi F9\") |\n| 3 | **`Năm`** — trục thời gian DUY NHẤT của sheet; mọi bảng phía sau tham chiếu dòng này |\n| **4 → N** | **⓿ KHỐI THÔNG SỐ CỤC BỘ CỦA SHEET** (dòng 4 = `Chỉ số năm t`, rồi lần lượt các thông số) |\n| N+1 | một dòng trống |\n| N+2 → | **Phần phân tích**: Bảng ② → ⑩ (hoặc ⑪.x với sheet kinh tế) |\n\nNói cách khác: **phần trên của sheet, từ dòng 4 tới hết khối ⓿, là thông số; phần phân tích chỉ bắt đầu sau đó.** Không rải thông số lẫn vào giữa các bảng tính.\n\n### Năm cột của khối ⓿\n\n| Cột | Nội dung |\n|---|---|\n| **A** | **LÝ DO / NGUỒN / QUY ƯỚC** — viết thành câu, ngay trên dòng của thông số đó (xem mục kế tiếp) |\n| **B** | Tên thông số, **đúng nguyên văn cách đề gọi**, kèm đơn vị trong ngoặc |\n| **C** | **Giá trị** — nền VÀNG. Chỉ được là `=ThongSo!$C$n`, **một bước duy nhất**, không bọc hàm, không tính toán |\n| **D** | Địa chỉ nguồn **dạng text**, vd `ThongSo!C88` — đọc bằng mắt, không cần bấm F2 |\n| **E** | Tên vùng (*Named Range*) nếu thông số đó được đặt tên |\n\n### Tám quy tắc trace (kiểm được, không phải lời khuyên chung)\n\n1. **Phần phân tích chỉ trỏ vào khối ⓿ của CHÍNH sheet đó** (`$C$12`), **tuyệt đối không** viết `ThongSo!$C$n` trực tiếp trong công thức tính. ⇒ *Trace Precedents* luôn nhảy trong cùng sheet, đúng một cấp.\n2. **Chỉ khối ⓿ được phép có tham chiếu liên sheet**, và chỉ đúng dạng echo `=ThongSo!$C$n`. Sheet kịch bản (`MoHinh_C5`) echo từ khối thông số kịch bản, không echo từ `MoHinh`.\n3. **Không có số cứng nào ngoài khối ⓿.** Cách kiểm: chọn vùng phân tích → `Ctrl+G` → *Special* → *Constants* → phải **rỗng** (trừ nhãn text).\n4. **Đặt Named Range** cho các thông số dùng nhiều lần: `ThueSuat`, `WACC`, `SoNamChuyenLo`, `EOCK`, `SER`, `SWRF`… Công thức đọc được thành `=EBIT*ThueSuat` thay vì `=C99*$C$24`.\n5. **Cột A của MỌI dòng phân tích ghi mô tả công thức dạng text** — đúng như gợi ý đáp án của trường làm (`I117=($C$110-$C$104-$C$107)/$C$31`). Sinh bằng UDF `FD(ô)` đã có trong module VBA của môn. Nhờ vậy đọc được logic cả sheet mà không phải bấm vào từng ô, và khi in ra PDF vẫn còn công thức.\n6. **Một trục thời gian duy nhất**: mọi bảng dùng chung hàng `Năm` (dòng 3) và `Chỉ số năm t` (dòng 4). Không sheet nào, không bảng nào tự dựng hàng năm riêng.\n7. **Mỗi bảng cách nhau đúng một dòng trống**, số bảng (②③④…) đặt ở cột B ⇒ `Ctrl+↓` nhảy đúng đầu bảng kế tiếp.\n8. **Ô tự kiểm tra (nền cam) đặt NGAY dưới bảng mà nó kiểm**, không dồn hết về cuối sheet — để lỗi hiện ra cạnh chỗ sinh ra lỗi.\n\n### Ghi LÝ DO chọn thông số ngay trên dòng của nó (cột A)\n\nChỗ nào đề bài **không nói rõ** mà mình phải chọn, thì cột A của đúng dòng đó phải trả lời được bốn câu: *chọn gì · vì sao · phương án còn lại là gì · đổi sang phương án kia thì lệch bao nhiêu*. Văn xuôi, không viết tắt. Mẫu thật từ PS2:\n\n> **A88:** \"Đề không nói lãi vay TGXD vốn hóa thuộc nhóm tài sản nào. `CONGTRINH` = dồn hết vào nhóm công trình 30 năm — theo câu chữ của đề *'chi phí đầu tư thiết bị… 10 năm; các chi phí khác… 30 năm'*, mà lãi vay không phải hạng mục thiết bị. `PRORATA` = chia theo tỷ trọng nguyên giá hai nhóm, đúng nguyên lý VAS 16 nhưng phải giả định thêm rằng khoản vay tài trợ đều cho mọi hạng mục. Chênh lệch đo được: NPV 12,89 so với 12,79 triệu USD — toàn bộ đến từ dòng thuế, vì khấu hao dồn vào những năm còn lỗ thì mất trắng do hạn chuyển lỗ 5 năm.\"\n>\n> **B88** = \"Phân bổ lãi vay TGXD vào nhóm khấu hao\" · **C88** = `CONGTRINH` (nền vàng) · **D88** = \"cờ sống — nối vào C55 của MoHinh và MoHinh_C5\"\n\nKèm theo, cuối khối ⓿ lập **Bảng ⓿.9 — SỔ QUY ƯỚC**, mỗi dòng một quy ước tự chọn, năm cột: *quy ước · giá trị đang chọn · phương án khả dĩ khác · ô cờ điều khiển · tác động đo được lên NPV*. Đây chính là nội dung mà phần thuyết minh và sheet `KetLuan` sẽ trích lại bằng `&TEXT(ô)&`, nên không bao giờ lệch số.\n\n### Phân biệt ba loại ô bằng màu (thống nhất toàn file)\n\n- **Nền VÀNG** = ô nhập liệu / echo thông số — được phép sửa\n- **Nền CAM** = ô tự kiểm tra — phải bằng 0 (trừ ô \"IRR ngân lưu nợ\" = lãi suất vay)\n- **Không nền** = ô công thức — không sửa tay\n- Ô nào là **giả định NGOÀI đề bài** thì thêm chữ đỏ trong cột A: *\"giả định ngoài đề\"*\n\n### Riêng sheet KINH TẾ — khối ⓿ phải echo hai nhóm\n\n**Nhóm 1 — thông số kế thừa từ mô hình tài chính** (link một bước tới `MoHinh!`, **không tự tính lại, không copy giá trị**): chi phí đầu tư theo giá thực & danh nghĩa, chi phí vận hành từng loại, sản lượng / lưu lượng, giá tài chính đầu ra, chỉ số giá & tỷ giá, số năm vòng đời. Có một ô kiểm tra: *tổng chi phí đầu tư ở sheet KinhTe − tổng ở MoHinh = 0*.\n\n**Nhóm 2 — thông số RIÊNG của phân tích kinh tế, và hầu hết là giả định NGOÀI đề:** EOCK (ghi **cả bản thực và bản danh nghĩa**, kèm công thức Fisher nối hai ô), hệ số chuyển đổi CF từng hạng mục, FEP và SER, SWRF (lương mờ), chi phí cơ hội của đất, VOT, VOC, hệ số *half-rule* cho lưu lượng tăng thêm, tỷ lệ thất thoát kỹ thuật, tham số đường cầu (a, b) nếu định giá bằng WTP.\n\nVới **mỗi** ô ở nhóm 2, cột A bắt buộc ghi **nguồn**: tên nghiên cứu / bảng / trang, hoặc nói thẳng *\"đề không cho — để 0, kết luận dựa vào phân tích ngưỡng\"*. Không được để trống, không được bịa một con số trông hợp lý.\n\nThêm một **ô cờ `Che_do_loi_ich`** ở khối ⓿:\n- `SỐ THẬT` — đã có VOT/VOC/CF từ nguồn ngoài ⇒ tính đủ ngân lưu kinh tế, EIRR, B/C, phân phối;\n- `NGƯỠNG` — đề không cho số kinh tế nào (như PS2) ⇒ để phần lợi ích = 0, dựng đầy đủ phía **chi phí** kinh tế, rồi **tính ngược ngưỡng lợi ích tối thiểu** (đ/đơn vị sản lượng) và so với mức giá/phí mà đề cho. Kết luận dựa vào ngưỡng, không dựa vào số bịa.\n\nÔ cờ này quyết định luôn cách viết kết luận, nên phải nằm trong khối ⓿ và được `KetLuan` trích lại.\n",

          "kind": "leaf",
          "detail": "Mỗi nhóm người dùng có hành vi khác nhau → giá kinh tế riêng, gồm 2 phần:\n\n- **Lợi ích thay thế nguồn lực** = giá nguồn cũ × lượng cũ (tiết kiệm chi phí nguồn đắt trước đây).\n- **Lợi ích tiêu dùng tăng thêm** = diện tích hình thang dưới đường cầu = `0,5·(P_cũ + P_mới)·(Q_mới − Q_cũ)`.\n- **Giá kinh tế nhóm** = tổng lợi ích ÷ **LƯỢNG NƯỚC DO DỰ ÁN CUNG CẤP cho nhóm đó** (không phải lượng tiêu dùng mới). Với nhóm được thay thế hoàn toàn thì hai cái trùng nhau; với nhóm chỉ được cấp phần tăng thêm thì mẫu số là **phần tăng thêm**. Ở BOO Thủ Đức bốn mẫu số lần lượt là 200 · 200 · **50** · 226,67 lít/người/ngày.\n\n*Ví dụ 4 nhóm BOO Thủ Đức (đ/m³):* mua nước tư nhân **17.650** · nước giếng **7.384** · bị hạn chế **7.750** · thất thoát phi kỹ thuật **15.809**.\n\n**Nguồn:** Ch.8 §8.3 (thặng dư tiêu dùng theo nhóm).\n\n### ⚠ BA CÁI BẪY của câu tính giá kinh tế theo WTP\n**1. Nhóm \"đã có nguồn nhưng bị hạn chế\" — KHÔNG có lợi ích thay thế, và MẪU SỐ là lượng TĂNG THÊM.**\nKhi đề nói *\"lượng cũ vẫn là nước sử dụng từ những nguồn trước đây, mức tăng thêm là do dự án cung cấp\"* thì dự án **chỉ** có tác động tăng thêm. Lợi ích thay thế = 0, và giá kinh tế = tổng lợi ích ÷ **lượng tăng thêm** (BOO Thủ Đức: ÷ 50 lít, **không** phải ÷ 200 lít). \"Giá cũ\" dùng ở đây là **WTP cận biên đọc từ đường cầu** tại mức tiêu dùng đang bị hạn chế (P(150) = 11.500 đ/m³) — chính là biểu hiện định lượng của tình trạng \"cung không đủ\".\n\n**2. Nhóm dùng nước thất thoát PHI kỹ thuật — tiêu dùng tới điểm P = 0.**\nKhông phải trả tiền ⇒ tiêu dùng tới điểm cắt trục hoành của đường cầu. Viết đường cầu ở dạng `P = a − b·Q` (BOO Thủ Đức: a = 34.000 là tung độ gốc, b = 150 là độ dốc) thì `Q tại P = 0` là **`a / b` = 34.000/150 = 226,67** lít/người/ngày. *(Gợi ý đáp án viết dạng `P = b + a·Q` với b = 34.000, a = −150 nên công thức của họ là `−b/a` — cùng một kết quả, chỉ khác ký hiệu. Luôn ghi rõ mình đang dùng ký hiệu nào.)* Nhóm này **vẫn có** lợi ích thay thế nếu đề nói trước đây họ mua nguồn đắt. **Số người phải SUY RA** = sản lượng ÷ mức tiêu dùng (12.000 m³/ngày × 1.000 ÷ 226,67 = 52.941 người).\n\n**3. Đừng quên nhóm nào, và kiểm chéo bằng tổng sản lượng.**\n`Σ sản lượng các nhóm = Công suất × (1 − thất thoát KỸ THUẬT)`. Nếu không khớp là sót nhóm hoặc trùng nhóm.\n\n### Luôn kiểm chéo đường cầu bằng dữ kiện của nhóm KHÁC\nDựng đường cầu từ hai điểm của **một** nhóm, rồi thay tọa độ của **nhóm khác** vào xem có ra đúng con số đề cho ở đoạn khác không. BOO Thủ Đức: đường cầu dựng từ nhóm mua nước tư nhân, thay Q = 176 lít (mức dùng nước giếng) ra **đúng 7.600 đ/m³** — con số đề cho độc lập ở một đoạn khác. Đó là bằng chứng đề đã thiết kế **một** đường cầu duy nhất cho \"người sử dụng tiêu biểu\" và cách dựng của mình đúng."

const canvas = document.getElementById("diagramCanvas");

const detailPanel = document.getElementById("detailPanel");
const scrim = document.getElementById("scrim");

const nodeById = new Map();
const parentById = new Map();
const displayNumberById = new Map();
(function index(node,parent){ nodeById.set(node.id,node);
  if(parent) parentById.set(node.id,parent);
  (node.children||[]).forEach(c=>index(c,node)); })(diagramData,null);
(function bfs(root){ const q=[root]; let n=1; while(q.length){ const x=q.shift();
  displayNumberById.set(x.id,n++); (x.children||[]).forEach(c=>q.push(c)); }})(diagramData);

const state = { expanded:new Set([diagramData.id]), focusedChildByParent:new Map(), zoom:0.9 };

const hasChildren = n => (n.children||[]).length>0;
function pathToRoot(id){ const p=[]; let c=nodeById.get(id); while(c){ p.unshift(c.id); c=parentById.get(c.id)||null; } return p; }
function topBranch(id){ return pathToRoot(id)[1]; }
function setFocus(path){ state.focusedChildByParent.clear();
  for(let i=0;i<path.length-1;i++) state.focusedChildByParent.set(path[i],path[i+1]); }
function visibleChildren(node){ const ch=node.children||[]; const f=state.focusedChildByParent.get(node.id);
  if(!f) return ch; const a=ch.find(c=>c.id===f); return a?[a]:ch; }

function toggleNode(id){
  if(state.expanded.has(id)){
    const parent=parentById.get(id);
    const p=parent?pathToRoot(parent.id):[]; state.expanded=new Set(p); setFocus(p);
    render(); centerNode(parent?parent.id:diagramData.id); return;
  }
  const p=pathToRoot(id); state.expanded=new Set(p); setFocus(p);
  render(); centerNode(id);
}

function makeNode(node){
  const wrap=document.createElement("div");
  const b=topBranch(node.id);
  wrap.className="node "+(node.kind||"")+(b?" branch-"+(((b%6)||6)):"")
    +(hasChildren(node)?" has-children":"")+(state.expanded.has(node.id)?" is-expanded":"");
  wrap.dataset.id=node.id;
  const num=document.createElement("div"); num.className="node-num";
  num.textContent=displayNumberById.get(node.id); wrap.appendChild(num);
  const main=document.createElement("button"); main.type="button"; main.className="node-main";
  main.textContent=node.title;
  if(node.en){const en=document.createElement("span");en.className="node-en";en.textContent=node.en;main.appendChild(en);}
  main.addEventListener("click",e=>{e.stopPropagation();openDetail(node.id);});
  wrap.appendChild(main);
  if(hasChildren(node)){
    const bar=document.createElement("button"); bar.type="button"; bar.className="node-expand-bar";
    bar.textContent=state.expanded.has(node.id)?"▲ thu":"▼ mo "+(node.children.length);
    bar.addEventListener("click",e=>{e.stopPropagation();toggleNode(node.id);});
    wrap.appendChild(bar);
  }
  return wrap;
}
function renderTree(node){
  const li=document.createElement("li"); li.appendChild(makeNode(node));
  if(hasChildren(node)&&state.expanded.has(node.id)){
    const ul=document.createElement("ul");
    visibleChildren(node).forEach(c=>ul.appendChild(renderTree(c)));
    li.appendChild(ul);
  }
  return li;
}
function render(){
  canvas.innerHTML="";
  const tree=document.createElement("ul"); tree.className="tree";
  tree.appendChild(renderTree(diagramData)); canvas.appendChild(tree);
  applyZoom(); requestAnimationFrame(drawConnectors);
}
function drawConnectors(){
  if(canvas.classList.contains("mode-list")) return;
  const old=canvas.querySelector("svg.links"); if(old) old.remove();
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","links");
  svg.setAttribute("width",canvas.scrollWidth); svg.setAttribute("height",canvas.scrollHeight);
  const cRect=canvas.getBoundingClientRect(); const s=state.zoom||1;
  const pt=(el,edge)=>{ const r=el.getBoundingClientRect();
    return { x:(r.left-cRect.left)/s + (r.width/s)/2,
             y:edge==="bottom"?(r.bottom-cRect.top)/s:(r.top-cRect.top)/s }; };
  canvas.querySelectorAll(".node.has-children.is-expanded").forEach(pEl=>{
    const li=pEl.closest("li"); const ul=li&&li.querySelector(":scope>ul"); if(!ul) return;
    const pP=pt(pEl,"bottom");
    ul.querySelectorAll(":scope>li>.node").forEach(cEl=>{
      const cP=pt(cEl,"top"); const midY=pP.y+Math.max(16,(cP.y-pP.y)/2);
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M "+pP.x+" "+pP.y+" V "+midY+" H "+cP.x+" V "+cP.y);
      svg.appendChild(path);
    });
  });
  canvas.insertBefore(svg,canvas.firstChild);
}
function applyZoom(){ canvas.style.transform="scale("+state.zoom+")";
  document.getElementById("zoomValue").textContent=state.zoom.toFixed(2)+"×"; }
function centerNode(id){ requestAnimationFrame(()=>{
  const el=canvas.querySelector('.node[data-id="'+id+'"]'); if(!el) return;
  const vR=viewport.getBoundingClientRect(), nR=el.getBoundingClientRect();
  const cx=nR.left-vR.left+viewport.scrollLeft+nR.width/2;
  viewport.scrollLeft=Math.max(0,cx-viewport.clientWidth/2);
  viewport.scrollTop=Math.max(0,nR.top-vR.top+viewport.scrollTop-70);
});}

/* -------- mini Markdown -------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){ return esc(s)
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/\*([^*]+)\*/g,"<em>$1</em>"); }
function renderMarkdown(src){
  const lines=(src||"").split("\n"); let html=""; let list=null; let i=0;
  const closeList=()=>{ if(list){html+=(list==="ul"?"</ul>":"</ol>");list=null;} };
  const openList=(t)=>{ if(list!==t){closeList(); html+=(t==="ul"?"<ul>":"<ol>"); list=t;} };
  const isRow=(l)=>/^\|.*\|$/.test(l);
  const isSep=(l)=>/^\|[\s:|-]+\|$/.test(l)&&l.indexOf("-")>=0;
  const cells=(l)=>l.replace(/^\||\|$/g,"").replace(/\\\|/g,"\u0000").split("|").map(c=>inline(c.trim().replace(/\u0000/g,"|")));
  while(i<lines.length){
    const raw=lines[i], l=raw.trim();
    if(!l){ closeList(); i++; continue; }
    /* khoi ma ``` */
    if(l.startsWith("```")){ closeList(); i++; const buf=[];
      while(i<lines.length && !lines[i].trim().startsWith("```")){ buf.push(lines[i]); i++; }
      i++; html+="<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; continue; }
    /* bang */
    if(isRow(l) && i+1<lines.length && isSep(lines[i+1].trim())){ closeList();
      const head=cells(l); i+=2; let body="";
      while(i<lines.length && isRow(lines[i].trim())){ 
        body+="<tr>"+cells(lines[i].trim()).map(c=>"<td>"+c+"</td>").join("")+"</tr>"; i++; }
      html+="<div class='md-table-wrap'><table><thead><tr>"+head.map(c=>"<th>"+c+"</th>").join("")
           +"</tr></thead><tbody>"+body+"</tbody></table></div>"; continue; }
    /* trich dan */
    if(l.startsWith(">")){ closeList(); const buf=[];
      while(i<lines.length && lines[i].trim().startsWith(">")){ buf.push(lines[i].trim().replace(/^>\s?/,"")); i++; }
      html+="<blockquote>"+renderMarkdown(buf.join("\n"))+"</blockquote>"; continue; }
    let m;
    if(m=l.match(/^#{1,4}\s+(.*)/)){ closeList(); html+="<h3>"+inline(m[1])+"</h3>"; }
    else if(m=l.match(/^[-*]\s+(.*)/)){ openList("ul"); html+="<li>"+inline(m[1])+"</li>"; }
    else if(m=l.match(/^\d+[.)]\s+(.*)/)){ openList("ol"); html+="<li>"+inline(m[1])+"</li>"; }
    else { closeList(); html+="<p>"+inline(l)+"</p>"; }
    i++;
  }
  closeList(); return html;
}

/* -------- detail panel -------- */
let detailHistory=[], currentDetailId=null;
function updateBackBtn(){ document.getElementById("backPanel").hidden = detailHistory.length===0; }
function goBackDetail(){ if(detailHistory.length) openDetail(detailHistory.pop(), true); }
function openDetail(id, fromBack){
  const node=nodeById.get(id); if(!node) return;
  if(!fromBack && currentDetailId!==null && currentDetailId!==id) detailHistory.push(currentDetailId);
  currentDetailId=id; updateBackBtn();
  document.getElementById("panelId").textContent="Node "+displayNumberById.get(id);
  document.getElementById("panelTitle").textContent=node.title;
  if(node.en){const pe=document.createElement("div");pe.className="panel-en";pe.textContent=node.en;document.getElementById("panelTitle").appendChild(pe);}
  const g=document.getElementById("panelGroup"); g.textContent=node.group||""; g.hidden=!node.group;
  document.getElementById("panelDescription").innerHTML=renderMarkdown(node.detail||"_Chua co mo ta._");
  const pills=document.getElementById("panelChildren"); pills.innerHTML="";
  const label=document.getElementById("childrenLabel");
  const ch=node.children||[]; label.hidden=ch.length===0;
  ch.forEach(c=>{ const b=document.createElement("button");
    b.textContent=displayNumberById.get(c.id)+". "+c.title;
    b.addEventListener("click",()=>openDetail(c.id)); pills.appendChild(b); });
  detailPanel.classList.add("open"); scrim.hidden=false;
}
function closeDetail(){ detailPanel.classList.remove("open"); scrim.hidden=true;
  detailHistory=[]; currentDetailId=null; updateBackBtn(); }

/* -------- controls -------- */
document.getElementById("backPanel").addEventListener("click",goBackDetail);
document.getElementById("closePanel").addEventListener("click",closeDetail);
scrim.addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });
document.getElementById("expandAll").addEventListener("click",()=>{
  state.focusedChildByParent.clear(); state.expanded=new Set([...nodeById.values()].filter(hasChildren).map(n=>n.id));
  render(); });
document.getElementById("collapseAll").addEventListener("click",()=>{
  state.expanded=new Set([diagramData.id]); state.focusedChildByParent.clear();
  render(); centerNode(diagramData.id); });
const layoutBtn=document.getElementById("layoutBtn");
layoutBtn.addEventListener("click",()=>{
  state.listMode=!state.listMode;
  canvas.classList.toggle("mode-list",state.listMode);
  layoutBtn.textContent=state.listMode?"⬒ Bố cục: Danh sách":"☰ Bố cục: Sơ đồ";
  if(state.listMode && state.expanded.size<=2){
    state.expanded=new Set([...nodeById.values()].filter(hasChildren).map(n=>n.id));
  }
  render();
});
const fsBtn=document.getElementById("fullscreenBtn");
const dcard=document.querySelector(".diagram-card");
fsBtn.addEventListener("click",()=>{
  if(!document.fullscreenElement){ if(dcard.requestFullscreen) dcard.requestFullscreen().catch(()=>{}); }
  else if(document.exitFullscreen){ document.exitFullscreen(); }
});
document.addEventListener("fullscreenchange",()=>{
  const fe=document.fullscreenElement;
  fsBtn.textContent=fe?"⛶ Thoát toàn màn hình":"⛶ Toàn màn hình";
  // panel mô tả + scrim phải nằm TRONG lớp fullscreen mới hiển thị được khi bấm node
  const host=fe||document.body;
  const sc=document.getElementById("scrim"), pn=document.getElementById("detailPanel");
  if(sc) host.appendChild(sc);
  if(pn) host.appendChild(pn);
  requestAnimationFrame(drawConnectors);
});
const zoomRange=document.getElementById("zoomRange");
zoomRange.addEventListener("input",e=>{ state.zoom=Number(e.target.value); applyZoom();
  requestAnimationFrame(drawConnectors); });
/* resize detail panel — kéo mép trái để nới rộng */
(function(){
  const panel=document.getElementById("detailPanel");
  const grip=document.getElementById("panelResizer");
  if(panel&&grip){
    let rz=false;
    const clamp=w=>Math.max(340,Math.min(window.innerWidth*0.96,w));
    grip.addEventListener("pointerdown",e=>{rz=true;grip.classList.add("active");try{grip.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
    grip.addEventListener("pointermove",e=>{ if(rz) panel.style.width=clamp(window.innerWidth-e.clientX)+"px"; });
    const stop=e=>{rz=false;grip.classList.remove("active");try{grip.releasePointerCapture(e.pointerId);}catch(_){}};
    grip.addEventListener("pointerup",stop); grip.addEventListener("pointercancel",stop);
    grip.addEventListener("dblclick",()=>{panel.style.width="";});
  }
})();
/* pan */
let drag=false,sx,sy,ssx,ssy;
viewport.addEventListener("pointerdown",e=>{ if(e.target.closest("button"))return;
  drag=true; viewport.classList.add("dragging"); sx=e.clientX;sy=e.clientY;
  ssx=viewport.scrollLeft;ssy=viewport.scrollTop; viewport.setPointerCapture(e.pointerId); });
viewport.addEventListener("pointermove",e=>{ if(!drag)return;
  viewport.scrollLeft=ssx-(e.clientX-sx); viewport.scrollTop=ssy-(e.clientY-sy); });
viewport.addEventListener("pointerup",()=>{drag=false;viewport.classList.remove("dragging");});
window.addEventListener("resize",()=>requestAnimationFrame(drawConnectors));

state.zoom=Number(zoomRange.value);
render(); centerNode(diagramData.id);
</script>
</body>
</html>
