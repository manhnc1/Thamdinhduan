<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Template Thẩm định Tài chính Dự án (MPP27)</title>
<style>
  :root{
    --bg:#0f172a; --card:#111c33; --ink:#e5edff; --muted:#93a4c9;
    --line:#31456f; --accent:#4f8cff;
    --b1:#4f8cff; --b2:#22c55e; --b3:#f59e0b; --b4:#ec4899; --b5:#a855f7; --b6:#14b8a6;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  .site-shell{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  .hero h1{margin:0 0 6px;font-size:26px}
  .hero .lede{margin:0;color:var(--muted);max-width:760px;font-size:14px;line-height:1.5}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 12px}
  .toolbar button{background:var(--card);color:var(--ink);border:1px solid var(--line);
       border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .toolbar button:hover{border-color:var(--accent)}
  .zoom-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-left:auto}
  .diagram-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .diagram-viewport{overflow:auto;height:70vh;cursor:grab}
  .diagram-viewport.dragging{cursor:grabbing}
  .diagram-canvas{transform-origin:top center;padding:28px 40px;width:max-content;min-width:100%;position:relative}
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0;display:flex;gap:26px;justify-content:center}
  ul.tree{flex-direction:column;align-items:center}
  ul.tree li{display:flex;flex-direction:column;align-items:center;position:relative}
  ul.tree li>ul{margin-top:34px}
  .node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:stretch;min-width:130px;max-width:200px}
  .node-main{background:#16233f;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;
       cursor:pointer;color:var(--ink);text-align:center;font-size:13px;line-height:1.35;font-weight:600;transition:.15s}
  .node-main:hover{border-color:var(--accent);transform:translateY(-1px)}
  .node-en{display:block;font-size:9.5px;font-weight:400;font-style:italic;color:var(--muted);margin-top:2px;line-height:1.25}
  .panel-en{font-size:13px;font-weight:400;font-style:italic;color:var(--muted);margin-top:2px}
  .node .node-num{font-size:10px;color:var(--muted);margin-bottom:3px;text-align:center}
  .node.is-expanded .node-main{box-shadow:0 0 0 2px rgba(79,140,255,.25)}
  .node-expand-bar{margin-top:5px;height:14px;border:none;border-radius:6px;background:#1d2c4d;color:var(--muted);
       cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}
  .node-expand-bar:hover{background:var(--accent);color:#fff}
  .node.branch-1 .node-main{border-color:var(--b1)} .node.branch-2 .node-main{border-color:var(--b2)}
  .node.branch-3 .node-main{border-color:var(--b3)} .node.branch-4 .node-main{border-color:var(--b4)}
  .node.branch-5 .node-main{border-color:var(--b5)} .node.branch-6 .node-main{border-color:var(--b6)}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  svg.links path{fill:none;stroke:var(--line);stroke-width:1.6}
  .scrim{position:fixed;inset:0;background:rgba(5,10,24,.55);z-index:40}
  .detail-panel{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);background:var(--card);
       border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:50;
       display:flex;flex-direction:column;padding:20px}
  .detail-panel.open{transform:translateX(0)}
  .panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .panel-id{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .panel-header h2{margin:4px 0 0;font-size:19px}
  .icon-button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .panel-group{color:var(--accent);font-size:12px;margin:10px 0 4px;font-weight:600}
  .markdown-content{font-size:14px;line-height:1.6;color:#cdd8f2;overflow:auto}
  .markdown-content h3{font-size:15px;margin:14px 0 6px}
  .markdown-content ul{padding-left:18px;margin:6px 0}
  .markdown-content code{background:#0c1830;padding:1px 5px;border-radius:4px;font-size:12px}
  .markdown-content a{color:var(--accent)}
  .child-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .child-pills button{background:#16233f;border:1px solid var(--line);color:var(--ink);border-radius:20px;
       padding:5px 10px;font-size:12px;cursor:pointer}
  .child-pills button:hover{border-color:var(--accent)}
  h3.section{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
</style>
</head>

  </main>
</div>

  </div>
  <div id="panelGroup" class="panel-group"></div>
  <div id="panelDescription" class="markdown-content"></div>
  <h3 class="section" id="childrenLabel" hidden>Cac nhanh con</h3>
  <div id="panelChildren" class="child-pills"></div>
</aside>

/* ================= ENGINE (khong can sua) ================= */
const canvas = document.getElementById("diagramCanvas");
const viewport = document.getElementById("diagramViewport");
const detailPanel = document.getElementById("detailPanel");
const scrim = document.getElementById("scrim");

const nodeById = new Map();
const parentById = new Map();
const displayNumberById = new Map();
(function index(node,parent){ nodeById.set(node.id,node);
  if(parent) parentById.set(node.id,parent);
  (node.children||[]).forEach(c=>index(c,node)); })(diagramData,null);
(function bfs(root){ const q=[root]; let n=1; while(q.length){ const x=q.shift();
  displayNumberById.set(x.id,n++); (x.children||[]).forEach(c=>q.push(c)); }})(diagramData);

const state = { expanded:new Set([diagramData.id]), focusedChildByParent:new Map(), zoom:0.9 };

const hasChildren = n => (n.children||[]).length>0;
function pathToRoot(id){ const p=[]; let c=nodeById.get(id); while(c){ p.unshift(c.id); c=parentById.get(c.id)||null; } return p; }
function topBranch(id){ return pathToRoot(id)[1]; }
function setFocus(path){ state.focusedChildByParent.clear();
  for(let i=0;i<path.length-1;i++) state.focusedChildByParent.set(path[i],path[i+1]); }
function visibleChildren(node){ const ch=node.children||[]; const f=state.focusedChildByParent.get(node.id);
  if(!f) return ch; const a=ch.find(c=>c.id===f); return a?[a]:ch; }

function toggleNode(id){
  if(state.expanded.has(id)){
    const parent=parentById.get(id);
    const p=parent?pathToRoot(parent.id):[]; state.expanded=new Set(p); setFocus(p);
    render(); centerNode(parent?parent.id:diagramData.id); return;
  }
  const p=pathToRoot(id); state.expanded=new Set(p); setFocus(p);
  render(); centerNode(id);
}

function makeNode(node){
  const wrap=document.createElement("div");
  const b=topBranch(node.id);
  wrap.className="node "+(node.kind||"")+(b?" branch-"+(((b%6)||6)):"")
    +(hasChildren(node)?" has-children":"")+(state.expanded.has(node.id)?" is-expanded":"");
  wrap.dataset.id=node.id;
  const num=document.createElement("div"); num.className="node-num";
  num.textContent=displayNumberById.get(node.id); wrap.appendChild(num);
  const main=document.createElement("button"); main.type="button"; main.className="node-main";
  main.textContent=node.title;
  if(node.en){const en=document.createElement("span");en.className="node-en";en.textContent=node.en;main.appendChild(en);}
  main.addEventListener("click",e=>{e.stopPropagation();openDetail(node.id);});
  wrap.appendChild(main);
  if(hasChildren(node)){
    const bar=document.createElement("button"); bar.type="button"; bar.className="node-expand-bar";
    bar.textContent=state.expanded.has(node.id)?"▲ thu":"▼ mo "+(node.children.length);
    bar.addEventListener("click",e=>{e.stopPropagation();toggleNode(node.id);});
    wrap.appendChild(bar);
  }
  return wrap;
}
function renderTree(node){
  const li=document.createElement("li"); li.appendChild(makeNode(node));
  if(hasChildren(node)&&state.expanded.has(node.id)){
    const ul=document.createElement("ul");
    visibleChildren(node).forEach(c=>ul.appendChild(renderTree(c)));
    li.appendChild(ul);
  }
  return li;
}
function render(){
  canvas.innerHTML="";
  const tree=document.createElement("ul"); tree.className="tree";
  tree.appendChild(renderTree(diagramData)); canvas.appendChild(tree);
  applyZoom(); requestAnimationFrame(drawConnectors);
}
function drawConnectors(){
  const old=canvas.querySelector("svg.links"); if(old) old.remove();
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","links");
  svg.setAttribute("width",canvas.scrollWidth); svg.setAttribute("height",canvas.scrollHeight);
  const cRect=canvas.getBoundingClientRect(); const s=state.zoom||1;
  const pt=(el,edge)=>{ const r=el.getBoundingClientRect();
    return { x:(r.left-cRect.left)/s + (r.width/s)/2,
             y:edge==="bottom"?(r.bottom-cRect.top)/s:(r.top-cRect.top)/s }; };
  canvas.querySelectorAll(".node.has-children.is-expanded").forEach(pEl=>{
    const li=pEl.closest("li"); const ul=li&&li.querySelector(":scope>ul"); if(!ul) return;
    const pP=pt(pEl,"bottom");
    ul.querySelectorAll(":scope>li>.node").forEach(cEl=>{
      const cP=pt(cEl,"top"); const midY=pP.y+Math.max(16,(cP.y-pP.y)/2);
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M "+pP.x+" "+pP.y+" V "+midY+" H "+cP.x+" V "+cP.y);
      svg.appendChild(path);
    });
  });
  canvas.insertBefore(svg,canvas.firstChild);
}
function applyZoom(){ canvas.style.transform="scale("+state.zoom+")";
  document.getElementById("zoomValue").textContent=state.zoom.toFixed(2)+"×"; }
function centerNode(id){ requestAnimationFrame(()=>{
  const el=canvas.querySelector('.node[data-id="'+id+'"]'); if(!el) return;
  const vR=viewport.getBoundingClientRect(), nR=el.getBoundingClientRect();
  const cx=nR.left-vR.left+viewport.scrollLeft+nR.width/2;
  viewport.scrollLeft=Math.max(0,cx-viewport.clientWidth/2);
  viewport.scrollTop=Math.max(0,nR.top-vR.top+viewport.scrollTop-70);
});}

/* -------- mini Markdown -------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){ return esc(s)
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/\*([^*]+)\*/g,"<em>$1</em>"); }
function renderMarkdown(src){
  const lines=(src||"").split("\n"); let html="",list=false;
  const closeList=()=>{ if(list){html+="</ul>";list=false;} };
  for(const raw of lines){ const l=raw.trim();
    if(!l){ closeList(); continue; }
    let m;
    if(m=l.match(/^#{1,4}\s+(.*)/)){ closeList(); html+="<h3>"+inline(m[1])+"</h3>"; }
    else if(m=l.match(/^[-*]\s+(.*)/)){ if(!list){html+="<ul>";list=true;} html+="<li>"+inline(m[1])+"</li>"; }
    else { closeList(); html+="<p>"+inline(l)+"</p>"; }
  }
  closeList(); return html;
}

/* -------- detail panel -------- */
function openDetail(id){
  const node=nodeById.get(id); if(!node) return;
  document.getElementById("panelId").textContent="Node "+displayNumberById.get(id);
  document.getElementById("panelTitle").textContent=node.title;
  if(node.en){const pe=document.createElement("div");pe.className="panel-en";pe.textContent=node.en;document.getElementById("panelTitle").appendChild(pe);}
  const g=document.getElementById("panelGroup"); g.textContent=node.group||""; g.hidden=!node.group;
  document.getElementById("panelDescription").innerHTML=renderMarkdown(node.detail||"_Chua co mo ta._");
  const pills=document.getElementById("panelChildren"); pills.innerHTML="";
  const label=document.getElementById("childrenLabel");
  const ch=node.children||[]; label.hidden=ch.length===0;
  ch.forEach(c=>{ const b=document.createElement("button");
    b.textContent=displayNumberById.get(c.id)+". "+c.title;
    b.addEventListener("click",()=>openDetail(c.id)); pills.appendChild(b); });
  detailPanel.classList.add("open"); scrim.hidden=false;
}
function closeDetail(){ detailPanel.classList.remove("open"); scrim.hidden=true; }

/* -------- controls -------- */
document.getElementById("closePanel").addEventListener("click",closeDetail);
scrim.addEventListener("click",closeDetail);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });
document.getElementById("expandAll").addEventListener("click",()=>{
  state.focusedChildByParent.clear(); state.expanded=new Set([...nodeById.values()].filter(hasChildren).map(n=>n.id));
  render(); });
document.getElementById("collapseAll").addEventListener("click",()=>{
  state.expanded=new Set([diagramData.id]); state.focusedChildByParent.clear();
  render(); centerNode(diagramData.id); });
const zoomRange=document.getElementById("zoomRange");
zoomRange.addEventListener("input",e=>{ state.zoom=Number(e.target.value); applyZoom();
  requestAnimationFrame(drawConnectors); });
/* pan */
let drag=false,sx,sy,ssx,ssy;
viewport.addEventListener("pointerdown",e=>{ if(e.target.closest("button"))return;
  drag=true; viewport.classList.add("dragging"); sx=e.clientX;sy=e.clientY;
  ssx=viewport.scrollLeft;ssy=viewport.scrollTop; viewport.setPointerCapture(e.pointerId); });
viewport.addEventListener("pointermove",e=>{ if(!drag)return;
  viewport.scrollLeft=ssx-(e.clientX-sx); viewport.scrollTop=ssy-(e.clientY-sy); });
viewport.addEventListener("pointerup",()=>{drag=false;viewport.classList.remove("dragging");});
window.addEventListener("resize",()=>requestAnimationFrame(drawConnectors));

state.zoom=Number(zoomRange.value);
render(); centerNode(diagramData.id);
</script>
