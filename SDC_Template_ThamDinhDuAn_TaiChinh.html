<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ Liên kết Tri thức — Thẩm định Đầu tư công (MPP27)</title>
<style>
:root{--bg:#0f1419;--panel:#1a2230;--panel2:#222c3d;--line:#2f3b4f;--text:#e7edf5;--muted:#9fb0c3;--accent:#7aa2f7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
#wrap{display:flex;height:100vh;overflow:hidden}
#stage{flex:1;position:relative}
svg{width:100%;height:100%;display:block;cursor:grab}svg.grabbing{cursor:grabbing}
#side{width:390px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side h1{font-size:15px;margin:0;padding:16px 18px 6px}
#side .sub{color:var(--muted);font-size:12px;padding:0 18px 12px;line-height:1.5;border-bottom:1px solid var(--line)}
#detail{padding:16px 18px;overflow-y:auto;flex:1}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;color:#0f1419;font-weight:700;margin-bottom:10px}
#detail h2{font-size:16px;margin:4px 0 6px;line-height:1.35}
.chips{margin:6px 0 14px}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11.5px;margin:0 5px 6px 0;color:#cfe0f5}
.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.doclist{list-style:none;margin:0;padding:0}
.doclist li{margin:0 0 7px}
.doclist a{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;text-decoration:none;color:var(--text);font-size:12.5px;line-height:1.4;transition:.15s;cursor:pointer}
.doclist a:hover{border-color:var(--accent);background:#26344a}
.doclist .meta{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.empty{color:var(--muted);font-size:13px;font-style:italic}
.open{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--accent);text-decoration:none}
.open:hover{text-decoration:underline}
.legend{position:absolute;left:14px;top:14px;background:rgba(26,34,48,.93);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;max-width:320px}
.legend b{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:7px}
.legend .row{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;opacity:.95}
.legend .row:hover{opacity:1}.legend .dot{width:12px;height:12px;border-radius:50%;flex:none}
.legend .tg{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;cursor:pointer}
.controls{position:absolute;right:14px;top:14px}
.controls input{background:rgba(26,34,48,.93);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 11px;font-size:13px;width:210px;outline:none}
.controls input:focus{border-color:var(--accent)}
.hint{position:absolute;left:14px;bottom:12px;color:var(--muted);font-size:11px;opacity:.85}
.node{cursor:pointer}
.node text{pointer-events:none;fill:var(--muted);font-size:9px}
.node.center text{font-size:13px;font-weight:700;fill:#0f1419}
.node.theme text{font-size:12px;font-weight:600;fill:var(--text)}
.node.doc text{font-size:9px;fill:var(--muted)}
.link{stroke:var(--line);stroke-opacity:.55}
.link.theme{stroke:#5b6b82;stroke-opacity:.4;stroke-dasharray:4 4}
.simlink{stroke-opacity:0}
.dim{opacity:.08}
</style></head>
<body><div id="wrap"><div id="stage">
<svg id="svg"></svg>
<div class="legend" id="legend"><b>Cụm chủ đề — nhấn để lọc</b></div>
<div class="controls"><input id="search" placeholder="Tìm tài liệu / khái niệm…"></div>
<div class="hint">Kéo nền để di chuyển · lăn chuột để phóng to · kéo node để sắp xếp · nhấn tài liệu để xem liên kết khái niệm</div>
</div><div id="side">
<h1>Liên kết Tri thức · Thẩm định Đầu tư công</h1>
<div class="sub" id="sub"></div>
<div id="detail"><p class="empty">Nhấn một cụm hoặc một tài liệu để xem chi tiết.</p></div>
</div></div>

V-Updated", "v": 0.6, "shared": ["chi phí vốn", "giá trị hiện tại ròng", "lạm phát", "ngân lưu", "thẩm định dự án", "đầu tư công"]}, {"s": "ProblemSet_ProblemSet1_Appraisal_2026-Problem_Set_1_Final", "t": "Đề_cương_môn_học_Appraisal_Syllabus-MPP27-V-Final", "v": 0.6, "shared": ["chi phí vốn", "giá trị hiện tại ròng", "lạm phát", "ngân lưu", "thẩm định dự án", "đầu tư công"]}, {"s": "ProblemSet_ProblemSet1_BaiLam_ProblemSet1_GiaiChiTiet", "t": "Đề_cương_môn_học_Appraisal_Syllabus-MPP27-V-Final", "v": 0.6, "shared": ["chi phí vốn", "hợp đồng BOT", "lạm phát", "ngân lưu", "phân tích kinh tế", "phân tích tài chính"]}, {"s": "ProblemSet_ProblemSet1_Appraisal_2026-Problem_Set_1-Q3_Input_Data_1", "t": "ProblemSet_ProblemSet1_Appraisal_2026-Problem_Set_1_Final", "v": 0.581, "shared": ["chi phí vốn", "ngân lưu", "ngân lưu ròng"]}, {"s": "Bài_13_-_14_13_2_V_Economic_Analysis_V_-Phu_luc_tr_299-304", "t": "Bài_9-10_09_1_V_NCTH_BOT_Cai_Lay_I", "v": 0.335, "shared": ["doanh thu", "lãi suất"]}], "tlinks": [["T0", "T1"], ["T0", "T2"], ["T1", "T2"]], "stats": {"docs": 40, "links": 185, "themes": 5}}, PREFIX="./";
const THEMES=DATA.themes, DOCS=DATA.docs, EDGES=DATA.edges, TLINKS=DATA.tlinks;
document.getElementById("sub").textContent=
  DATA.stats.docs+" tài liệu · "+DATA.stats.themes+" cụm chủ đề · "+DATA.stats.links+" liên kết khái niệm. Cây tỏa tròn: tâm → cụm → tài liệu. Nhấn một tài liệu để thấy các tài liệu chia sẻ thuật ngữ chuyên ngành với nó.";
const colorOf=Object.fromEntries(THEMES.map(t=>[t.id,t.color]));
const docOf=Object.fromEntries(DOCS.map(d=>[d.id,d]));

// ---- build nodes/links (tree) ----
const nodes=[], links=[];
const CENTER={id:"__c",type:"center",label:"THẨM ĐỊNH\nĐẦU TƯ CÔNG",r:32};
nodes.push(CENTER);
THEMES.forEach(t=>{nodes.push({id:t.id,type:"theme",theme:t.id,label:t.name,r:15});
  links.push({s:"__c",t:t.id,kind:"core"});});
TLINKS.forEach(([a,b])=>links.push({s:a,t:b,kind:"theme"}));
DOCS.forEach(d=>{nodes.push({id:d.id,type:"doc",theme:d.theme,label:d.label,bai:d.bai,rel:d.rel,
  concepts:d.concepts,deg:d.deg,r:4+Math.min(6,Math.sqrt(d.deg)*1.7)});
  links.push({s:d.theme,t:d.id,kind:"core"});});
const N=Object.fromEntries(nodes.map(n=>[n.id,n]));

const svg=document.getElementById("svg");let W=svg.clientWidth,H=svg.clientHeight;
nodes.forEach((n,i)=>{const a=i*2.399;const rad=n.type==="center"?0:(n.type==="theme"?150:330);
  n.x=W/2+Math.cos(a)*rad+(Math.random()-.5)*50;n.y=H/2+Math.sin(a)*rad+(Math.random()-.5)*50;n.vx=0;n.vy=0;});
CENTER.x=W/2;CENTER.y=H/2;
const NS="http://www.w3.org/2000/svg";
const gZoom=document.createElementNS(NS,"g");svg.appendChild(gZoom);
const gSim=document.createElementNS(NS,"g");gZoom.appendChild(gSim);
const gLink=document.createElementNS(NS,"g");gZoom.appendChild(gLink);
const gNode=document.createElementNS(NS,"g");gZoom.appendChild(gNode);

// tree links
const linkEls=links.map(l=>{const e=document.createElementNS(NS,"line");
  e.setAttribute("class","link"+(l.kind==="theme"?" theme":""));gLink.appendChild(e);l.el=e;return l;});
// similarity links (hidden until selection or toggle)
const maxV=Math.max.apply(null,EDGES.map(e=>e.v));
const simEls=EDGES.map(l=>{const e=document.createElementNS(NS,"line");e.setAttribute("class","simlink");
  const col=docOf[l.s].theme===docOf[l.t].theme?colorOf[docOf[l.s].theme]:"#8595a8";
  e.setAttribute("stroke",col);e.setAttribute("stroke-width",(0.5+l.v/maxV*2).toFixed(2));
  gSim.appendChild(e);l.el=e;return l;});

const nodeEls=nodes.map(n=>{const gg=document.createElementNS(NS,"g");gg.setAttribute("class","node "+n.type);
  const c=document.createElementNS(NS,"circle");c.setAttribute("r",n.r);
  if(n.type==="center"){c.setAttribute("fill","#e7edf5");}
  else if(n.type==="theme"){c.setAttribute("fill",colorOf[n.theme]);c.setAttribute("stroke","#0f1419");c.setAttribute("stroke-width","2");}
  else{c.setAttribute("fill",colorOf[n.theme]);c.setAttribute("fill-opacity",n.deg?".75":".35");c.setAttribute("stroke",colorOf[n.theme]);c.setAttribute("stroke-opacity",".5");}
  gg.appendChild(c);
  const tx=document.createElementNS(NS,"text");tx.setAttribute("text-anchor","middle");
  if(n.type==="center"){String(n.label).split("\n").forEach((ln,i)=>{const ts=document.createElementNS(NS,"tspan");ts.setAttribute("x",0);ts.setAttribute("dy",i===0?"-2":"15");ts.textContent=ln;tx.appendChild(ts);});tx.setAttribute("y",0);}
  else{let lbl=n.type==="doc"&&n.label.length>30?n.label.slice(0,28)+"…":n.label;tx.textContent=lbl;tx.setAttribute("y",(-n.r-5).toFixed(1));}
  gg.appendChild(tx);gNode.appendChild(gg);n.el=gg;
  gg.addEventListener("click",ev=>{ev.stopPropagation();select(n);});enableDrag(gg,n);return n;});

function tick(){
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];
    let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;if(d2<90000){const f=2300/d2,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;}}
  links.forEach(l=>{const a=N[l.s],b=N[l.t];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const rest=l.kind==="theme"?210:(b.type==="theme"?150:70);const f=(d-rest)*0.02;dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
  nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.001;n.vy+=(H/2-n.y)*0.001;});
  CENTER.x=W/2;CENTER.y=H/2;CENTER.vx=0;CENTER.vy=0;
  nodes.forEach(n=>{if(n.fixed)return;n.x+=n.vx*=.86;n.y+=n.vy*=.86;});draw();}
function draw(){
  linkEls.forEach(l=>{const a=N[l.s],b=N[l.t];l.el.setAttribute("x1",a.x);l.el.setAttribute("y1",a.y);l.el.setAttribute("x2",b.x);l.el.setAttribute("y2",b.y);});
  simEls.forEach(l=>{const a=N[l.s],b=N[l.t];l.el.setAttribute("x1",a.x);l.el.setAttribute("y1",a.y);l.el.setAttribute("x2",b.x);l.el.setAttribute("y2",b.y);});
  nodeEls.forEach(n=>n.el.setAttribute("transform",`translate(${n.x},${n.y})`));}
let frames=0;(function loop(){tick();if(frames++<650)requestAnimationFrame(loop);})();
function reheat(){frames=0;(function l(){tick();if(frames++<200)requestAnimationFrame(l);})();}

let scale=1,tx0=0,ty0=0,panning=false,sx,sy;
function applyZoom(){gZoom.setAttribute("transform",`translate(${tx0},${ty0}) scale(${scale})`);}
svg.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const mx=e.offsetX,my=e.offsetY;tx0=mx-(mx-tx0)*f;ty0=my-(my-ty0)*f;scale*=f;applyZoom();},{passive:false});
svg.addEventListener("mousedown",e=>{if(e.target.closest(".node"))return;panning=true;svg.classList.add("grabbing");sx=e.clientX-tx0;sy=e.clientY-ty0;});
window.addEventListener("mousemove",e=>{if(panning){tx0=e.clientX-sx;ty0=e.clientY-sy;applyZoom();}});
window.addEventListener("mouseup",()=>{panning=false;svg.classList.remove("grabbing");});
svg.addEventListener("click",()=>clearSel());
function enableDrag(gg,n){let dr=false,ox,oy;gg.addEventListener("mousedown",e=>{e.stopPropagation();dr=true;n.fixed=true;const p=toG(e);ox=p.x-n.x;oy=p.y-n.y;});
  window.addEventListener("mousemove",e=>{if(!dr)return;const p=toG(e);n.x=p.x-ox;n.y=p.y-oy;draw();});
  window.addEventListener("mouseup",()=>{if(dr){dr=false;n.fixed=false;reheat();}});}
function toG(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-tx0)/scale,y:(e.clientY-r.top-ty0)/scale};}

const detail=document.getElementById("detail");
let showAllSim=false;
function nbrs(id){const o=[];EDGES.forEach(l=>{if(l.s===id)o.push([l.t,l.v,l.shared]);else if(l.t===id)o.push([l.s,l.v,l.shared]);});o.sort((a,b)=>b[1]-a[1]);return o;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function showSimFor(id){simEls.forEach(l=>{const on=(l.s===id||l.t===id);l.el.style.strokeOpacity=on?0.55:0;});}
function hideSim(){if(showAllSim){simEls.forEach(l=>l.el.style.strokeOpacity=0.13);}else{simEls.forEach(l=>l.el.style.strokeOpacity=0);}}

function select(n){
  if(n.type==="center"){clearSel();detail.innerHTML=`<h2>Thẩm định Đầu tư công · MPP27</h2><p class="empty">${DATA.stats.themes} cụm chủ đề, ${DATA.stats.docs} tài liệu. Nhấn một cụm (node có viền) hoặc một tài liệu.</p>`;return;}
  if(n.type==="theme"){
    const t=THEMES.find(t=>t.id===n.id);const keep=new Set([n.id,"__c",...t.docs]);
    nodeEls.forEach(m=>m.el.classList.toggle("dim",!keep.has(m.id)));
    linkEls.forEach(l=>l.el.classList.toggle("dim",!(keep.has(l.s)&&keep.has(l.t))));hideSim();
    detail.innerHTML=`<span class="badge" style="background:${t.color}">Cụm chủ đề</span><h2>${esc(t.name)}</h2>
      <p class="sec">${t.docs.length} tài liệu</p>
      <ul class="doclist">${t.docs.map(id=>`<li><a data-go="${esc(id)}">${esc(docOf[id].label)}<span class="meta">${esc(docOf[id].bai)}</span></a></li>`).join("")}</ul>`;
    detail.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",()=>select(N[a.dataset.go])));return;}
  // doc
  const nb=nbrs(n.id);const keep=new Set([n.id,n.theme,"__c"]);nb.forEach(x=>keep.add(x[0]));
  nodeEls.forEach(m=>m.el.classList.toggle("dim",!keep.has(m.id)));
  linkEls.forEach(l=>l.el.classList.toggle("dim",!(keep.has(l.s)&&keep.has(l.t))));
  showSimFor(n.id);
  const t=THEMES.find(t=>t.id===n.theme);
  detail.innerHTML=`<span class="badge" style="background:${t.color}">${esc(t.name)}</span><h2>${esc(n.label)}</h2>
    <div class="meta" style="color:var(--muted);font-size:11.5px">${esc(n.bai||"")}</div>
    <div class="sec">Khái niệm chuyên ngành (${n.concepts.length})</div>
    <div class="chips">${n.concepts.length?n.concepts.map(c=>`<span class="chip">${esc(c)}</span>`).join(""):'<span class="empty">Không trích được khái niệm (bảng tính số liệu).</span>'}</div>
    <div class="sec">Liên kết với ${nb.length} tài liệu</div>
    <ul class="doclist">${nb.map(([id,v,sh])=>`<li><a data-go="${esc(id)}">${esc(docOf[id].label)}<span class="meta">${sh.length?'chung: '+sh.slice(0,5).map(esc).join(', '):'tương đồng'} · ${v}</span></a></li>`).join("")||'<li class="empty">Chưa nối được với tài liệu nào.</li>'}</ul>
    <a class="open" href="${PREFIX+encodeURI(n.rel)}" target="_blank">↗ Mở tài liệu gốc</a>`;
  detail.querySelectorAll("[data-go]").forEach(a=>a.addEventListener("click",()=>select(N[a.dataset.go])));}
function clearSel(){nodeEls.forEach(m=>m.el.classList.remove("dim"));linkEls.forEach(l=>l.el.classList.remove("dim"));hideSim();}

const legend=document.getElementById("legend");
THEMES.forEach(t=>{const r=document.createElement("div");r.className="row";
  r.innerHTML=`<span class="dot" style="background:${t.color}"></span><span>${esc(t.name)}</span>`;
  r.addEventListener("click",()=>select(N[t.id]));legend.appendChild(r);});
const tg=document.createElement("div");tg.className="tg";
tg.innerHTML=`<input type="checkbox" id="tgsim"> <label for="tgsim" style="cursor:pointer">Hiện toàn bộ liên kết khái niệm</label>`;
legend.appendChild(tg);
tg.querySelector("#tgsim").addEventListener("change",e=>{showAllSim=e.target.checked;hideSim();});

document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(!q){clearSel();return;}
  const hit=new Set(["__c"]);DOCS.forEach(d=>{if(d.label.toLowerCase().includes(q)||d.concepts.some(c=>c.toLowerCase().includes(q)))hit.add(d.id);});
  THEMES.forEach(t=>{if(t.name.toLowerCase().includes(q))hit.add(t.id);});
  nodeEls.forEach(m=>m.el.classList.toggle("dim",!hit.has(m.id)));
  linkEls.forEach(l=>l.el.classList.toggle("dim",!(hit.has(l.s)&&hit.has(l.t))));});
window.addEventListener("resize",()=>{W=svg.clientWidth;H=svg.clientHeight;reheat();});
